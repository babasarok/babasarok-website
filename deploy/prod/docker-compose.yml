# Production stack: vendure + worker + postgres, one-shot migrations.
# Shared edge Caddy attaches to this stack's network from deploy/infra.
# The .env beside this file holds all secrets; it is provisioned on the box
# and never shipped by the deploy.
name: babasarok-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # One runaway container must not starve the box: the 2026-11-08 incident
    # had a sync-job OOM loop fill RAM+swap until the OS OOM-killed the API.
    mem_limit: 1g
    environment:
      POSTGRES_USER: babasarok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: babasarok
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babasarok -d babasarok"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: ./repo
    restart: "no"
    env_file:
      - .env
      # Written by the deploy script from the cloudflare build env (last
      # file wins) — cloudflare-owned secrets propagate on every deploy.
      - .env.cloudflare
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://babasarok:${POSTGRES_PASSWORD}@postgres:5432/babasarok
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  vendure:
    build: ./repo
    restart: unless-stopped
    # The Node heap flag must sit BELOW the cgroup cap: with the default heap
    # (~2 GB) over a 1 GB cap, memory pressure turns into a GC death spiral
    # (100% CPU, requests hang) instead of a clean Node OOM restart. 1.5 GB
    # heap under a 2 GB cap leaves room for legit admin read spikes (bulk
    # definition reads peak ~600 MB over the ~300 MB steady).
    mem_limit: 2g
    memswap_limit: 2g
    # The edge Caddy sits on every stack's network; the per-stack alias keeps
    # the hostname→stack routing unambiguous (bare `vendure` would be a
    # cross-network DNS coin-flip).
    networks:
      default:
        aliases:
          - vendure-prod
    env_file:
      - .env
      - .env.cloudflare
    environment:
      NODE_ENV: production
      # Heap flag below the cgroup cap — see the mem_limit comment above.
      NODE_OPTIONS: --max-old-space-size=1536
      DATABASE_URL: postgres://babasarok:${POSTGRES_PASSWORD}@postgres:5432/babasarok
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    volumes:
      # Vendure-owned imagery (ADR 0009): uploads and previews persist on the
      # box and are copied into preview stacks on every preview deploy.
      - assets:/app/backend/assets

  worker:
    build: ./repo
    restart: unless-stopped
    env_file:
      - .env
      - .env.cloudflare
    environment:
      NODE_ENV: production
      # A single variant sync of a big product (1000+ variants) peaks above
      # the ~2 GB default heap and OOM-looped the worker on 2026-11-08. 3 GB
      # lets those syncs finish; mem_limit (= memswap_limit, swap forbidden)
      # turns a worse runaway into a contained worker restart instead of an
      # OS-wide memory panic that kills the API.
      NODE_OPTIONS: --max-old-space-size=3072
      DATABASE_URL: postgres://babasarok:${POSTGRES_PASSWORD}@postgres:5432/babasarok
    command: ["node", "dist/index-worker.js"]
    mem_limit: 3584m
    memswap_limit: 3584m
    stop_grace_period: 30s
    # The worker has no HTTP listener (it polls the DB job queue), so probe
    # its one critical dependency instead: a DB round-trip with its own
    # credentials. Process death is already covered by restart: unless-stopped.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const{Client}=require('pg');new Client({connectionString:process.env.DATABASE_URL}).connect().then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  assets:
