# Test stack: same shape as prod but NODE_ENV=development (no SMTP_* env on
# purpose — the env.ts gate then selects file transport, so test traffic can
# never email a real buyer) and its own database.
name: babasarok-test

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: babasarok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: babasarok
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babasarok -d babasarok"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: ./repo
    restart: "no"
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://babasarok:${POSTGRES_PASSWORD}@postgres:5432/babasarok
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  vendure:
    build: ./repo
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://babasarok:${POSTGRES_PASSWORD}@postgres:5432/babasarok
    # AdminUiPlugin requires an existing vendure-ui-config.json at the app
    # path (it overwrites the content with runtime values at boot); the
    # committed artifact omits it, so create the empty shell if missing.
    # $$ escapes compose interpolation so the shell sees the fallback.
    command: ["sh", "-c", "CFG=\"/app/backend/admin-ui-dist/vendure-ui-config.json\"; test -f \"$CFG\" || echo '{}' > \"$CFG\"; exec node dist/index.js"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  worker:
    build: ./repo
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://babasarok:${POSTGRES_PASSWORD}@postgres:5432/babasarok
    command: ["node", "dist/index-worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
