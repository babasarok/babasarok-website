# Shared edge: Caddy terminates TLS for the API hostnames and routes into
# the stacks' networks by per-stack alias (vendure-prod / vendure-test).
# The stack networks are injected at deploy time via the generated
# docker-compose.networks.yml override (one entry per existing stack) —
# declared statically here, this file would fail on a not-yet-deployed
# stack, and pre-created networks break the stacks' own compose (label
# mismatch).
name: babasarok-edge

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      # The edge must be public; 80 serves ACME HTTP-01 challenges.
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
