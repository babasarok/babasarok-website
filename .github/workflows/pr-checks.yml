name: PR Checks

on:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `typegen` generates the Tina client + Astro types, needed by any
        # check that type-checks the app. `build:local` does its own tina build.
        include:
          - { name: Format, run: "npx prettier --check .", typegen: "false" }
          - { name: Lint, run: "npm run lint", typegen: "true" }
          - { name: Stylelint, run: "npm run lint:style", typegen: "false" }
          - { name: Astro Check, run: "npx astro check", typegen: "true" }
          - {
              name: Svelte Check,
              run: "npx svelte-check --tsconfig ./tsconfig.json",
              typegen: "true",
            }
          - { name: Build, run: "npm run build:local", typegen: "false" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          typegen: ${{ matrix.typegen }}
      # Branch-scoped build cache. Restored after `npm ci` (which wipes
      # node_modules) so Astro's persistent cache survives. `dist` is included
      # for completeness, but the real speedup is `node_modules/.astro`, which
      # holds Astro's image-optimization + content cache (e.g. transcoded Tina
      # images), avoiding re-fetching/re-encoding on every run.
      # key:    new entry per commit so each build saves fresh cache.
      # restore-keys: fall back to the latest cache on the same branch.
      - name: Cache Astro build output
        if: matrix.name == 'Build'
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.astro
          key: astro-build-${{ github.head_ref }}-${{ github.sha }}
          restore-keys: |
            astro-build-${{ github.head_ref }}-
      - run: ${{ matrix.run }}
